[tool.pytest.ini_options]
testpaths = ["source", "scripts/demos/reef_tour"]
pythonpath = ["scripts/demos/reef_tour"]
addopts = "--import-mode=importlib"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",
    "B905",
]

[tool.ruff.lint.isort]
known-first-party = ["isaacswim", "isaacswim_bench", "reef_course", "rl_envs"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
