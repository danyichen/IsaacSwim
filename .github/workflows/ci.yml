name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "source/isaacswim[mujoco,warp,netcdf,cfd]" -e "source/isaacswim-bench[data]" pytest ruff pyflakes
      - name: Lint
        run: ruff check source scripts
      - name: Test
        run: pytest -q
      - name: Tutorials
        shell: bash
        run: |
          python scripts/tutorials/sphere_terminal_velocity.py
          python scripts/tutorials/port_from_mujoco.py

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - name: Build distributions
        run: |
          python -m build source/isaacswim --outdir "$PWD/dist"
          python -m build source/isaacswim-bench --outdir "$PWD/dist"
          twine check --strict dist/*
      - name: Check public files
        run: python scripts/tools/check_release.py --wheels dist
      - name: Install wheels
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          python -c "import isaacswim, isaacswim.assets, isaacswim_bench; print(isaacswim.__version__)"
      - name: Retain distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  no-mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e source/isaacswim -e source/isaacswim-bench pytest
      - run: python -c "import isaacswim, isaacswim.assets, isaacswim_bench; print(isaacswim.__version__)"
      - run: pytest -q
