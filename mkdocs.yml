site_name: IsaacSwim
site_description: Underwater robotics for NVIDIA Isaac Sim and Isaac Lab
site_url: https://danyichen.github.io/IsaacSwim/
repo_url: https://github.com/danyichen/IsaacSwim
repo_name: danyichen/IsaacSwim
edit_uri: ""
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - First simulation: first_simulation.md
  - Physics:
      - Physics model: physics.md
      - Hydrodynamics: hydrodynamics.md
      - Water and currents: environment.md
  - Robots:
      - Vehicles: vehicles.md
      - Actuators: actuators.md
      - Navigation sensors: sensors.md
      - Cameras and sonar: sensing.md
      - BlueROV2 Heavy: bluerov.md
  - Integrations:
      - OceanSim and ROS 2: ecosystem.md
      - Porting from MuJoCo: porting_from_mujoco.md
  - Tasks:
      - Tasks and scenes: tasks.md
  - Project:
      - Benchmark methods: benchmarks.md
      - Changelog: changelog.md
      - Citing: citing.md
      - Licensing: licensing.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - stylesheets/extra.css

